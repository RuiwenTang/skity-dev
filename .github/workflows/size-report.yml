name: Size Report

# Workflow B: post/update the PR comment from the size-result artifact
# produced by Size Check. Triggered via workflow_run so it runs in the
# default-branch context with a full-permission token, which is what keeps
# commenting working for PRs opened from fork repositories (where the
# pull_request workflow itself only gets a read-only token).
#
# NOTE: this workflow must exist on the default branch to fire at all, and
# the copy that runs is always the default-branch one.

on:
    workflow_run:
        workflows:
            - Size Check
        types:
            - completed

permissions:
    pull-requests: write

jobs:
    comment:
        name: comment size report
        if: github.event.workflow_run.conclusion == 'success'
        runs-on: ${{ vars.SIZE_RUNNER || 'ubuntu-22.04' }}
        timeout-minutes: 10
        steps:
            - name: Download Size Result
              uses: actions/download-artifact@v4
              with:
                  name: size-result
                  run-id: ${{ github.event.workflow_run.id }}
                  github-token: ${{ secrets.GITHUB_TOKEN }}
                  path: size-result
            - name: Resolve Pull Request
              id: pr
              shell: bash
              run: |
                  pr_number=$(python3 -c "import json; print(json.load(open('size-result/size-data.json')).get('pr_number') or '')")
                  echo "number=$pr_number" >> "$GITHUB_OUTPUT"
            # only parses data files from the artifact; never executes
            # anything out of it
            - name: Comment On Pull Request
              if: steps.pr.outputs.number != ''
              uses: actions/github-script@v7
              with:
                  script: |
                      const fs = require('fs');
                      const body = fs.readFileSync('size-result/comment.md', 'utf8');
                      const issueNumber = Number('${{ steps.pr.outputs.number }}');
                      const marker = '<!-- skity-size-report -->';
                      const { data: comments } = await github.rest.issues.listComments({
                          owner: context.repo.owner,
                          repo: context.repo.repo,
                          issue_number: issueNumber,
                          per_page: 100,
                      });
                      const previous = comments.find((c) => c.body && c.body.includes(marker));
                      if (previous) {
                          await github.rest.issues.updateComment({
                              owner: context.repo.owner,
                              repo: context.repo.repo,
                              comment_id: previous.id,
                              body,
                          });
                          core.info(`updated comment ${previous.html_url}`);
                      } else {
                          const { data: created } = await github.rest.issues.createComment({
                              owner: context.repo.owner,
                              repo: context.repo.repo,
                              issue_number: issueNumber,
                              body,
                          });
                          core.info(`created comment ${created.html_url}`);
                      }
